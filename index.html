                html += '<td style="padding: 8px; text-align: center; border-top: 2px solid #ddd;">' + badge(totalPass) + '</td>';
                html += '</tr>';
                // R/E 对比行
                const dpRE = dpE > 1e-12 ? dpR / dpE : 0;
                const mcRE = mcResult.energy_used > 1e-12 ? mcResult.total_reward / mcResult.energy_used : 0;
                const reDiff = Math.abs(dpRE - mcRE);
                const rePass = reDiff < Math.max(0.01, dpRE * 0.05);
                html += '<tr>';
                html += '<td style="padding: 8px; border-bottom: 1px solid #eee;">总奖励 R</td>';
                html += '<td style="padding: 8px; text-align: right; border-bottom: 1px solid #eee;">' + fmt(dpR) + '</td>';
                html += '<td style="padding: 8px; text-align: right; border-bottom: 1px solid #eee;">' + fmt(mcResult.total_reward) + '</td>';
                html += '<td style="padding: 8px; text-align: right; border-bottom: 1px solid #eee;">' + fmt(Math.abs(dpR - mcResult.total_reward)) + '</td>';
                html += '<td style="padding: 8px; text-align: center; border-bottom: 1px solid #eee;">-</td>';
                html += '</tr>';
                html += '<tr>';
                html += '<td style="padding: 8px;">R/E 比</td>';
                html += '<td style="padding: 8px; text-align: right;">' + fmt4(dpRE) + '</td>';
                html += '<td style="padding: 8px; text-align: right;">' + fmt4(mcRE) + '</td>';
                html += '<td style="padding: 8px; text-align: right;">' + fmt4(reDiff) + '</td>';
                html += '<td style="padding: 8px; text-align: center;">' + badge(rePass) + '</td>';
                html += '</tr>';

                // 更新表头为 max_reward 语义
                const mcCard = document.getElementById('mc-card');
                const thRow = mcCard.querySelector('thead tr');
                thRow.innerHTML = '<th style="padding: 8px; text-align: left; border-bottom: 2px solid #ddd;">装备节点</th>'
                    + '<th style="padding: 8px; text-align: right; border-bottom: 2px solid #ddd;">DP 预计</th>'
                    + '<th style="padding: 8px; text-align: right; border-bottom: 2px solid #ddd;">MC 模拟</th>'
                    + '<th style="padding: 8px; text-align: right; border-bottom: 2px solid #ddd;">偏差</th>'
                    + '<th style="padding: 8px; text-align: center; border-bottom: 2px solid #ddd;">状态</th>';

                document.getElementById('mc-table-body').innerHTML = html;
                document.getElementById('mc-info').textContent = '能量预算: ' + energyBudget.toLocaleString() + ' | 模拟局数: ' + mcResult.games.toLocaleString() + ' | 实际消耗: ' + mcResult.energy_used.toLocaleString() + ' | 阈值: 件数偏差<5%, R/E<5%';
            }
            
            calculateBtn.addEventListener('click', function() {
                const level = parseInt(levelInput.value);
                const target = parseInt(document.getElementById('target').value);
                const objective = document.querySelector('input[name="objective"]:checked').value;

                if (!level || !target) return;

                // max_reward 模式收集奖励权重
                let reward_weights = null;
                if (objective === 'max_reward') {
                    reward_weights = {
                        100: parseInt(document.getElementById('rw-100').value) || 0,
                        200: parseInt(document.getElementById('rw-200').value) || 0,
                        300: parseInt(document.getElementById('rw-300').value) || 0,
                        350: parseInt(document.getElementById('rw-350').value) || 0,
                        450: parseInt(document.getElementById('rw-450').value) || 0
                    };
                }

                lastParams = { level, target, objective, reward_weights };

                calculateBtn.disabled = true;
                calculateBtn.innerHTML = '<span class="loading-spinner"></span><span>计算中...</span>';
                mcValidateBtn.disabled = true;

                const worker = new Worker('solver-worker.js');
                worker.onmessage = function(evt) {
                    const { success, p, e_val, r_val, node_probs, tree, memo_action, start_shield, start_boost, start_lucky, target: resultTarget } = evt.data;

                    if (success) {
                        // 存入 lastParams 供 MC 验证使用
                        lastParams = { level, target, objective, reward_weights, node_probs, r_val, e_val };

                        // 动态结果展示：max_reward 模式显示 P/E/R/R-E比，其他模式保持原样
                        const successRateEl = document.getElementById('success-rate');
                        const energyEl = document.getElementById('energy-consumption');
                        const targetDistEl = document.getElementById('target-distance');
                        const optTargetEl = document.getElementById('optimization-target');
                        const energyLabelEl = energyEl.previousElementSibling;
                        const targetDistLabelEl = targetDistEl.previousElementSibling;
                        const optTargetLabelEl = optTargetEl.previousElementSibling;

                        if (objective === 'max_reward') {
                            successRateEl.textContent = (p * 100).toFixed(4) + '%';
                            energyEl.textContent = e_val.toFixed(2);
                            energyLabelEl.textContent = '总能量 E';
                            targetDistEl.textContent = r_val.toFixed(2);
                            targetDistLabelEl.textContent = '总奖励 R';
                            optTargetEl.textContent = (e_val > 1e-12 ? (r_val / e_val).toFixed(4) : '0');
                            optTargetLabelEl.textContent = 'R/E 比';

                            // 渲染预计装备件数表格
                            const forecastCard = document.getElementById('reward-forecast-card');
                            const forecastBody = document.getElementById('forecast-table-body');
                            const forecastInfo = document.getElementById('forecast-info');
                            const energyBudget = parseInt(mcSimulationsInput.value) || 100000;
                            let html = '';
                            let totalForecastReward = 0;
                            let totalForecastCount = 0;
                            const nodes = [100, 200, 300, 350, 450];
                            for (const n of nodes) {
                                const prob = node_probs ? (node_probs[n] || 0) : 0;
                                const forecastCount = e_val > 1e-12 ? energyBudget * prob / e_val : 0;
                                const weight = reward_weights[n] || 0;
                                totalForecastReward += forecastCount * weight;
                                totalForecastCount += forecastCount;
                                html += '<tr>';
                                html += '<td style="padding: 8px; border-bottom: 1px solid #eee;">' + n + 'm</td>';
                                html += '<td style="padding: 8px; text-align: right; border-bottom: 1px solid #eee;">' + weight + '</td>';
                                html += '<td style="padding: 8px; text-align: right; border-bottom: 1px solid #eee;">' + (prob * 100).toFixed(4) + '%</td>';
                                html += '<td style="padding: 8px; text-align: right; border-bottom: 1px solid #eee;">' + forecastCount.toFixed(2) + '</td>';
                                html += '<td style="padding: 8px; text-align: right; border-bottom: 1px solid #eee;">' + (energyBudget > 0 ? (forecastCount / energyBudget).toFixed(6) : '0') + '</td>';
                                html += '</tr>';
                            }
                            // 总件数行
                            html += '<tr style="background: #f8f9fa; font-weight: bold;">';
                            html += '<td style="padding: 8px; border-top: 2px solid #ddd;">总件数</td>';
                            html += '<td style="padding: 8px; text-align: right; border-top: 2px solid #ddd; color: #999;">—</td>';
                            html += '<td style="padding: 8px; text-align: right; border-top: 2px solid #ddd; color: #999;">—</td>';
                            html += '<td style="padding: 8px; text-align: right; border-top: 2px solid #ddd;">' + totalForecastCount.toFixed(2) + '</td>';
                            html += '<td style="padding: 8px; text-align: right; border-top: 2px solid #ddd;">' + (energyBudget > 0 ? (totalForecastCount / energyBudget).toFixed(6) : '0') + '</td>';
                            html += '</tr>';
                            forecastBody.innerHTML = html;
                            forecastInfo.textContent = '能量预算: ' + energyBudget.toLocaleString() + ' | 预计局数: ' + (e_val > 1e-12 ? (energyBudget / e_val).toFixed(1) : '0') + ' | 总件数: ' + totalForecastCount.toFixed(2) + ' | 总预计奖励: ' + totalForecastReward.toFixed(2);
                            forecastCard.style.display = 'block';
                        } else {
                            successRateEl.textContent = (p * 100).toFixed(4) + '%';
                            energyEl.textContent = (e_val / p).toFixed(2);
                            energyLabelEl.textContent = '期望能量消耗';
                            targetDistEl.textContent = resultTarget + 'm';
                            targetDistLabelEl.textContent = '目标距离';
                            optTargetEl.textContent = '冲距离';
                            optTargetLabelEl.textContent = '优化目标';
                            document.getElementById('reward-forecast-card').style.display = 'none';
                        }

                        const mainPath = extractMainPath(tree);
                        currentMainPath = mainPath; // 保存主线供一图流使用
                        document.getElementById('flowchart-container').innerHTML = renderFlowchart(mainPath);
                        document.getElementById('failure-branch-detail').innerHTML = '';
                        currentFailureIdx = -1;
                        document.getElementById('flowchart-card').style.display = 'block';
                        document.getElementById('one-image-btn').style.display = 'inline-block';

                        mcValidateBtn.disabled = false;
                        document.getElementById('mc-card').style.display = 'block';
                        document.getElementById('mc-table-body').innerHTML = '<tr><td colspan="5" style="padding: 20px; text-align: center; color: #999;">点击"蒙特卡洛验证"按钮开始</td></tr>';
                        document.getElementById('mc-info').textContent = '';
                    } else {
                        alert('计算出错：' + evt.data.error);
                    }

                    worker.terminate();
                    calculateBtn.disabled = false;
                    calculateBtn.innerHTML = '<span>开始计算</span>';
                };
                worker.onerror = function(err) {
                    alert('Worker错误：' + err.message);
                    worker.terminate();
                    calculateBtn.disabled = false;
                    calculateBtn.innerHTML = '<span>开始计算</span>';
                };
                worker.postMessage({ level, target, objective, reward_weights });
            });

            mcValidateBtn.addEventListener('click', function() {
                if (!lastParams) return;
                const n = parseInt(mcSimulationsInput.value) || 100000;

                mcValidateBtn.disabled = true;
                mcValidateBtn.innerHTML = '<span class="loading-spinner"></span><span>模拟中...</span>';
                document.getElementById('mc-table-body').innerHTML = '<tr><td colspan="5" style="padding: 20px; text-align: center; color: #666;">蒙特卡洛模拟运行中（' + n.toLocaleString() + ' 次）...</td></tr>';

                const worker = new Worker('solver-worker.js');
                worker.onmessage = function(evt) {
                    const { success, p, e_val, mc_result, error } = evt.data;
                    if (success && mc_result) {
                        if (mc_result.type === 'reward') {
                            const energyBudget = mc_result.energy_budget;
                            renderMcRewardResult(lastParams.r_val, lastParams.e_val, lastParams.node_probs, mc_result, energyBudget, lastParams.reward_weights);
                        } else {
                            renderMcResult(p, e_val, mc_result);
                        }
                    } else {
                        document.getElementById('mc-table-body').innerHTML = '<tr><td colspan="5" style="padding: 20px; text-align: center; color: #dc2626;">错误: ' + (error || '未知错误') + '</td></tr>';
                    }
                    worker.terminate();
                    mcValidateBtn.disabled = false;
                    mcValidateBtn.innerHTML = '<span>蒙特卡洛验证</span>';
                };
                worker.onerror = function(err) {
                    alert('Worker错误：' + err.message);
                    worker.terminate();
                    mcValidateBtn.disabled = false;
                    mcValidateBtn.innerHTML = '<span>蒙特卡洛验证</span>';
                };
                worker.postMessage({
                    level: lastParams.level,
                    target: lastParams.target,
                    objective: lastParams.objective,
                    reward_weights: lastParams.reward_weights || null,
                    mc_validate: true,
                    n_simulations: n
                });
            });
        });
    </script>
</body>
</html>
